name: tests
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fix go.mod
        id: fix_go_mod
        run: .github/scripts/zip.sh
      - name: run tests
        id: run_tests
        run: .github/scripts/test.sh